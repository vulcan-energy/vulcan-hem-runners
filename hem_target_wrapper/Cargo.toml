[package]
name = "hem_target_wrapper"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Thin WASM bridge for pinned HEM FHS targets"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hem-target-core = { path = "../hem-target-core" }
hem_upstream = { package = "home-energy-model", path = "../hem_engine_upstream" }
hem_fhs_upstream = { package = "home-energy-model-wrapper-fhs", path = "../hem_fhs_upstream" }
wasm-bindgen = "0.2"
serde_json = "1.0"
getrandom = { version = "0.3.3", features = ["wasm_js"], default-features = false }
getrandom04 = { package = "getrandom", version = "0.4.2", features = ["wasm_js"], default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen-rayon = { version = "1.3.0", default-features = false, features = ["no-bundler"] }

[patch."https://github.com/communitiesuk/epb-home-energy-model.git"]
home-energy-model = { path = "../hem_engine_upstream" }
[patch.crates-io]
jsonschema_046 = { package = "jsonschema", path = "../vendor/jsonschema-0.46.5-offline" }
