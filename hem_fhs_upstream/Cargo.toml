[package]
name = "home-energy-model-wrapper-fhs"
version = "1.0.0-alpha-7"
edition = "2021"
rust-version = "1.85.0"

[dependencies]
anyhow = "1.0.100"
approx = "0.5.1"
bitflags = "2.12.1"
clap = { version = "4.5.53", features = ["derive"], optional = true }
csv = "1.4.0"
#home-energy-model = { path = "../epb-home-energy-model", features = ["clap"] }
home-energy-model = { git = "https://github.com/communitiesuk/epb-home-energy-model.git", branch = "main", features = ["clap"] }
indexmap = { version = "2.12.1", features = ["serde"] }
itertools = "0.14.0"
jsonschema = "0.46.5"
parking_lot = { version = "0.12.5", features = ["hardware-lock-elision"] }
partial_application = "0.2.1"
rand = "0.10.1"
rand_distr = "0.6.0"
rand_mt = { version = "6.0.3", features = ["rand-traits"] }
rand_pcg = "0.10.2"
rayon = "1.11.0"
rstest = "0.26.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_valid = "2.0.0"
smartstring = "1.0.1"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.17"
tracing = "0.1.43"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"

[lib]
# don't build doctests for now
doctest = false

[workspace]
members = ["fhs-compliance-lambda"]

[[bin]]
name = "future-homes-standard"
path = "src/main.rs"
doc = false
required-features = ["clap"]

[features]
default = []
indicatif = ["home-energy-model/indicatif"]
